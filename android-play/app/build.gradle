plugins { id 'com.android.application' }
android {
    namespace 'com.hoclaixecungdat.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.hoclaixecungdat.app'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.1.1'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.test'; versionNameSuffix '-test'; buildConfigField 'boolean', 'APK_UPDATES', 'false' }
        release { minifyEnabled false; buildConfigField 'boolean', 'APK_UPDATES', 'false' }
        sideload { initWith release; matchingFallbacks = ['release']; buildConfigField 'boolean', 'APK_UPDATES', 'true' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
