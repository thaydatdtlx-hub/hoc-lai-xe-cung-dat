name: Remove receipt transfer panel

on:
  push:
    paths:
      - '.github/workflows/remove-receipt-transfer-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch receipt layout and validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          receipt_path = Path('payment-receipt.js')
          source = receipt_path.read_text(encoding='utf-8')

          payment_info_tail = '''    <div><span>Trạng thái</span><strong>${escapeHtml(isVoided?"Đã hủy":"Đã xác nhận")}</strong></div>`;

  return `<!doctype html>'''
          payment_info_replacement = '''    <div><span>Trạng thái</span><strong>${escapeHtml(isVoided?"Đã hủy":"Đã xác nhận")}</strong></div>`;
  const paymentPanel=isBankTransfer?"":`
      <div class="party payment-info">
        <h2>Thông tin thanh toán</h2>
        <div class="payment-lines">${paymentInfo}</div>
      </div>`;

  return `<!doctype html>'''
          if payment_info_tail not in source:
              raise SystemExit('Không tìm thấy vị trí tạo khối thông tin thanh toán.')
          source = source.replace(payment_info_tail, payment_info_replacement, 1)

          old_panel = '''      <div class="party payment-info">
        <h2>${isBankTransfer?"Thông tin chuyển khoản":"Thông tin thanh toán"}</h2>
        <div class="payment-lines">${paymentInfo}</div>
        ${transferQr}
      </div>'''
          if old_panel not in source:
              raise SystemExit('Không tìm thấy khối Thông tin chuyển khoản trên biên lai.')
          source = source.replace(old_panel, '      ${paymentPanel}', 1)

          old_section = '    <section class="party-grid">'
          new_section = '    <section class="party-grid${isBankTransfer?" is-single":""}">'
          if old_section not in source:
              raise SystemExit('Không tìm thấy party-grid trên biên lai.')
          source = source.replace(old_section, new_section, 1)

          css_marker = 'border-bottom:1.5px solid var(--line)}.party h2'
          css_replacement = 'border-bottom:1.5px solid var(--line)}.party-grid.is-single{grid-template-columns:1fr}.party h2'
          if css_marker not in source:
              raise SystemExit('Không tìm thấy CSS party-grid.')
          source = source.replace(css_marker, css_replacement, 1)

          receipt_path.write_text(source, encoding='utf-8')

          validation_path = Path('scripts/validate-payments.mjs')
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace('for(const required of ["BIÊN LAI HỌC PHÍ","PT-20260801-ABC123"', 'for(const required of ["PT-20260801-ABC123"', 1)

          old_qr_check = '''for(const required of [
  '<figure class="transfer-qr">',
  "Quét mã để chuyển khoản",
  "/api/tuition-qr?",
  "amount=5000000",
  "addInfo=HP%20Van%20An%2001ABC123",
  "Mã QR chuyển khoản học phí MB Bank"
]){
  if(!html.includes(required))throw new Error(`Biên lai chuyển khoản thiếu mã QR hoặc dữ liệu QR: ${required}`);
}'''
          new_qr_check = '''for(const removed of [
  "Thông tin chuyển khoản",
  '<figure class="transfer-qr">',
  "Quét mã để chuyển khoản",
  "/api/tuition-qr?"
]){
  if(html.includes(removed))throw new Error(`Biên lai học phí vẫn còn phần chuyển khoản đã yêu cầu xóa: ${removed}`);
}'''
          if old_qr_check not in validation:
              raise SystemExit('Không tìm thấy kiểm tra QR cũ của biên lai.')
          validation = validation.replace(old_qr_check, new_qr_check, 1)
          validation_path.write_text(validation, encoding='utf-8')
          PY

      - name: Validate payments
        run: node scripts/validate-payments.mjs

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payment-receipt.js scripts/validate-payments.mjs
          git commit -m "Xóa phần chuyển khoản khỏi biên lai học phí"
          git push origin HEAD:main
