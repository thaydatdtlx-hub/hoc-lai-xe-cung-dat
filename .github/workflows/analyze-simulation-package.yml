name: Analyze simulation package

on:
  push:
    branches:
      - docs/simulation-media-source-audit
    paths:
      - .github/workflows/analyze-simulation-package.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SETUP1_CAB_ID: 1ikfLw9io14py41qRbycRZg2trWL6m2iF

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract cmake ninja-build binutils
          python -m pip install --disable-pip-version-check gdown

      - name: Download first cabinet and extract database components
        run: |
          mkdir -p report extracted
          gdown "https://drive.google.com/uc?id=${SETUP1_CAB_ID}" -O Setup1.cab
          cabextract -q -d extracted -F 'tss.db' Setup1.cab || true
          cabextract -q -d extracted -F 'OnTapMoPhong.exe' Setup1.cab || true
          test -s extracted/tss.db
          test -s extracted/OnTapMoPhong.exe
          sha256sum extracted/tss.db | tee report/tss-db-sha256.txt

      - name: Build SQLite3 Multiple Ciphers shell
        run: |
          git clone --depth 1 https://github.com/utelle/SQLite3MultipleCiphers.git sqlite3mc-src
          cmake -S sqlite3mc-src -B sqlite3mc-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQLITE3MC_BUILD_SHELL=ON
          cmake --build sqlite3mc-build --config Release
          test -x sqlite3mc-build/sqlite3mc_shell

      - name: Export schema and all video rows
        shell: bash
        run: |
          DB_PASS=$(strings -a extracted/OnTapMoPhong.exe | grep -E '^db[0-9a-f]{32,64}$' | head -n 1)
          test -n "$DB_PASS"
          MC=sqlite3mc-build/sqlite3mc_shell

          {
            echo "PRAGMA cipher='chacha20';"
            printf "PRAGMA key='%s';\n" "$DB_PASS"
            echo '.schema video'
            echo 'PRAGMA table_info(video);'
            echo 'SELECT count(*) AS video_rows FROM video;'
          } > report/schema.sql
          "$MC" extracted/tss.db < report/schema.sql > report/video-schema.txt 2> report/video-schema-error.txt

          {
            echo "PRAGMA cipher='chacha20';"
            printf "PRAGMA key='%s';\n" "$DB_PASS"
            echo '.headers on'
            echo '.mode csv'
            echo 'SELECT * FROM video ORDER BY chapter, th;'
          } > report/export.sql
          "$MC" extracted/tss.db < report/export.sql > report/video.csv 2> report/video-export-error.txt

          sed -i 's/^PRAGMA key=.*/PRAGMA key=[REDACTED];/' report/schema.sql report/export.sql
          echo '--- schema ---'
          cat report/video-schema.txt
          echo '--- first rows ---'
          head -n 8 report/video.csv
          echo '--- row count including header ---'
          wc -l report/video.csv

      - name: Save database report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-database-export
          path: report/
          if-no-files-found: error
          compression-level: 9
          retention-days: 1
