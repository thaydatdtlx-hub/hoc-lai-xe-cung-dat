name: Analyze simulation package

on:
  push:
    branches:
      - docs/simulation-media-source-audit
    paths:
      - .github/workflows/analyze-simulation-package.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SETUP_MSI_ID: 1sR3TGcdd6G_PlSW66ixKMQ-WvBgZx2j5
  SETUP1_CAB_ID: 1ikfLw9io14py41qRbycRZg2trWL6m2iF

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract msitools ffmpeg sqlite3 file
          python -m pip install --disable-pip-version-check gdown

      - name: Download MSI and first cabinet from shared Drive
        run: |
          gdown "https://drive.google.com/uc?id=${SETUP_MSI_ID}" -O Setup.msi
          gdown "https://drive.google.com/uc?id=${SETUP1_CAB_ID}" -O Setup1.cab
          sha256sum Setup.msi Setup1.cab | tee sha256.txt
          ls -lh Setup.msi Setup1.cab | tee sizes.txt

      - name: Inspect MSI tables and cabinet listing
        run: |
          mkdir -p report extracted
          msiinfo export Setup.msi Media > report/media.tsv || true
          msiinfo export Setup.msi File > report/file.tsv || true
          cabextract -l Setup1.cab > report/setup1-listing.txt
          grep -Ei 'chapter[1-6]_th[0-9]+\.pt|count_down\.pt|tss\.db|OnTapMoPhong\.exe|sqlitecipher\.dll|qsqlite\.dll' report/setup1-listing.txt > report/setup1-interesting.txt || true
          cat report/setup1-interesting.txt

      - name: Extract diagnostic targets
        run: |
          first_pt=$(awk '/chapter[1-6]_th[0-9]+\.pt/{print $NF; exit}' report/setup1-listing.txt || true)
          if [ -n "$first_pt" ]; then
            cabextract -q -d extracted -F "$first_pt" Setup1.cab || true
          fi
          for f in tss.db OnTapMoPhong.exe sqlitecipher.dll qsqlite.dll; do
            cabextract -q -d extracted -F "$f" Setup1.cab || true
          done
          find extracted -maxdepth 1 -type f -printf '%f\t%s bytes\n' | tee report/extracted-files.txt

          for f in extracted/*; do
            [ -f "$f" ] || continue
            echo "===== $f =====" | tee -a report/file-analysis.txt
            file "$f" | tee -a report/file-analysis.txt
            xxd -l 128 "$f" | tee -a report/file-analysis.txt
          done

      - name: Verify RC4 video key on first scenario
        run: |
          python - <<'PY'
          from pathlib import Path
          src = next(Path('extracted').glob('chapter*_th*.pt'))
          out = Path('extracted/first-scenario.mp4')
          key = bytes.fromhex('175ce5fb82404109cb627c50a5c56115')
          s = list(range(256)); j = 0
          for i in range(256):
              j = (j + s[i] + key[i % len(key)]) & 255
              s[i], s[j] = s[j], s[i]
          i = j = 0
          with src.open('rb') as fi, out.open('wb') as fo:
              while True:
                  chunk = fi.read(1024 * 1024)
                  if not chunk: break
                  buf = bytearray(len(chunk))
                  for n, b in enumerate(chunk):
                      i = (i + 1) & 255
                      j = (j + s[i]) & 255
                      s[i], s[j] = s[j], s[i]
                      buf[n] = b ^ s[(s[i] + s[j]) & 255]
                  fo.write(buf)
          PY
          ffprobe -v error -show_entries format=format_name,duration,size -show_entries stream=codec_name,codec_type,width,height,r_frame_rate -of json extracted/first-scenario.mp4 | tee report/first-scenario.ffprobe.json

      - name: Save report and bounded samples
        uses: actions/upload-artifact@v4
        with:
          name: simulation-package-analysis
          path: |
            report/
            sha256.txt
            sizes.txt
            extracted/tss.db
            extracted/OnTapMoPhong.exe
            extracted/sqlitecipher.dll
            extracted/qsqlite.dll
            extracted/first-scenario.mp4
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
