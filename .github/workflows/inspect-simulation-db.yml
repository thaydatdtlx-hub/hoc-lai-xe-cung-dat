name: Inspect simulation database

on:
  push:
    branches: [docs/simulation-media-source-audit]
    paths: [.github/workflows/inspect-simulation-db.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract msitools build-essential
          python -m pip install --disable-pip-version-check gdown
      - name: Download first package cabinet
        run: |
          gdown 'https://drive.google.com/uc?id=1ikfLw9io14py41qRbycRZg2trWL6m2iF' -O Setup1.cab
          mkdir -p extracted report
          cabextract -q -d extracted -F tss.db Setup1.cab
          cabextract -q -d extracted -F OnTapMoPhong.exe Setup1.cab
      - name: Build compatible SQLite3MC shell
        run: |
          git clone --depth 1 https://github.com/utelle/SQLite3MultipleCiphers.git sqlite3mc-src
          cd sqlite3mc-src
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j2
          find . -type f -perm -111 -name 'sqlite3*' -print | tee ../../report/sqlite3mc-binaries.txt
      - name: Inspect video table
        shell: bash
        run: |
          set +e
          SHELL_BIN=$(find sqlite3mc-src/build -type f -perm -111 -name 'sqlite3*' | head -1)
          DB_PASS=$(strings -a extracted/OnTapMoPhong.exe | grep -E '^db[0-9a-f]{30,}$' | head -1)
          for cipher in chacha20 sqlcipher aes256cbc aes128cbc rc4; do
            URI="file:extracted/tss.db?cipher=${cipher}&key=${DB_PASS}"
            echo "Trying ${cipher}" >> report/database-probe.txt
            "$SHELL_BIN" "$URI" ".tables" >> report/database-probe.txt 2>&1
            "$SHELL_BIN" -header -csv "$URI" "select * from video order by chapter, th;" > "report/video-${cipher}.csv" 2>"report/video-${cipher}.err"
          done
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-database-inspection
          path: report/
          retention-days: 1
