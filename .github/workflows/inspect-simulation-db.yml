name: Inspect simulation database

on:
  push:
    branches:
      - main
      - fix/simulation-db-inspection-v2
    paths:
      - .github/workflows/inspect-simulation-db.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract msitools build-essential cmake
          python -m pip install --disable-pip-version-check gdown

      - name: Download first package cabinet
        run: |
          gdown 'https://drive.google.com/uc?id=1ikfLw9io14py41qRbycRZg2trWL6m2iF' -O Setup1.cab
          mkdir -p extracted report
          cabextract -q -d extracted -F tss.db Setup1.cab
          cabextract -q -d extracted -F OnTapMoPhong.exe Setup1.cab
          test -s extracted/tss.db
          test -s extracted/OnTapMoPhong.exe
          sha256sum extracted/tss.db | tee report/tss-db-sha256.txt

      - name: Build compatible SQLite3MC shell
        run: |
          git clone --depth 1 https://github.com/utelle/SQLite3MultipleCiphers.git sqlite3mc-src
          cmake -S sqlite3mc-src -B sqlite3mc-build -DCMAKE_BUILD_TYPE=Release
          cmake --build sqlite3mc-build -j2
          find sqlite3mc-build -type f -perm -111 -name 'sqlite3*' -print | tee report/sqlite3mc-binaries.txt
          test -s report/sqlite3mc-binaries.txt

      - name: Inspect video table
        shell: bash
        run: |
          set -u
          SHELL_BIN=$(find sqlite3mc-build -type f -perm -111 -name 'sqlite3*' | head -1)
          test -n "$SHELL_BIN"
          DB_PASS=$(strings -a extracted/OnTapMoPhong.exe | grep -E '^db[0-9a-f]{30,}$' | head -1 || true)
          test -n "$DB_PASS"
          echo "::add-mask::$DB_PASS"
          : > report/database-probe.txt
          success=0
          for cipher in chacha20 sqlcipher aes256cbc aes128cbc rc4; do
            URI="file:extracted/tss.db?cipher=${cipher}&key=${DB_PASS}"
            echo "Trying ${cipher}" | tee -a report/database-probe.txt
            tables=$("$SHELL_BIN" "$URI" ".tables" 2>&1 || true)
            printf '%s\n' "$tables" >> report/database-probe.txt
            if printf '%s\n' "$tables" | grep -qw video; then
              success=1
              echo "WORKING_CIPHER=${cipher}" | tee report/working-cipher.txt
              "$SHELL_BIN" "$URI" ".schema video" > report/video-schema.sql
              "$SHELL_BIN" -header -csv "$URI" "pragma table_info(video);" > report/video-table-info.csv
              "$SHELL_BIN" -header -csv "$URI" "select count(*) as row_count from video;" > report/video-count.csv
              "$SHELL_BIN" -header -csv "$URI" "select * from video order by chapter, th;" > report/video.csv
              "$SHELL_BIN" "$URI" ".schema" > report/database-schema.sql
              break
            fi
          done
          test "$success" -eq 1
          echo "Video table columns:"
          cat report/video-table-info.csv
          echo "Video rows:"
          cat report/video-count.csv
          echo "First rows:"
          head -6 report/video.csv

      - name: Validate 120 source timings against tss.db
        run: |
          python - <<'PY'
          import csv, json, hashlib, sys
          from pathlib import Path

          timing = json.loads(Path('public/data/mo-phong-120-timing-source.json').read_text(encoding='utf-8'))
          rows = list(csv.DictReader(Path('report/video.csv').open(encoding='utf-8', newline='')))
          rows = [r for r in rows if int(r['chapter'] or 0) > 0]

          def parse_mark(value):
              a, b, c = [int(x) for x in value.split(':')]
              return round(a * 60 + b + c / 100, 2)

          errors = []
          if len(rows) != 120:
              errors.append(f'tss.db has {len(rows)} scenario rows, expected 120')
          if timing.get('scenarioCount') != 120 or len(timing.get('scenarios', [])) != 120:
              errors.append('timing source does not contain exactly 120 scenarios')

          db_sha = hashlib.sha256(Path('extracted/tss.db').read_bytes()).hexdigest()
          if timing.get('sourceDatabaseSha256') != db_sha:
              errors.append(f'sourceDatabaseSha256 mismatch: {db_sha}')

          by_id = {int(x['id']): x for x in timing.get('scenarios', [])}
          for r in rows:
              sid = int(r['th'])
              x = by_id.get(sid)
              if not x:
                  errors.append(f'missing timing-source scenario {sid}')
                  continue
              checks = [
                  ('chapter', int(r['chapter']), int(x['chapter'])),
                  ('file', r['name'], x['file']),
                  ('durationMilliseconds', int(r['duration']), int(x['durationMilliseconds'])),
                  ('dangerStart', parse_mark(r['start']), round(float(x['dangerStart']), 2)),
                  ('dangerEnd', parse_mark(r['end']), round(float(x['dangerEnd']), 2)),
                  ('title', r['description'].strip(), x['title'].strip()),
              ]
              for field, actual, expected in checks:
                  if actual != expected:
                      errors.append(f'scenario {sid} {field}: db={actual!r} timing={expected!r}')

          if errors:
              print('\n'.join(errors[:50]))
              print(f'TOTAL_ERRORS={len(errors)}')
              sys.exit(1)

          print('PASS: tss.db matches committed timing source for all 120 scenarios.')
          print('PASS: source table exposes only start/end timing markers; no separate 5/4/3/2/1 columns exist.')
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-database-inspection
          path: report/
          retention-days: 1
