name: Verify production build

on:
  push:
    branches: [main, docs/simulation-media-source-audit, feat/simulation-review-question-bank]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify simulation module
        run: |
          node --check public/mo-phong/core.mjs
          node --check public/mo-phong/app.mjs
          node scripts/test-simulation-media.mjs
      - name: Build production bundle
        run: npm run build
      - name: Verify static simulation page is shipped
        run: |
          test -f dist/mo-phong-120.html
          test -f dist/mo-phong/app.mjs
          test -f dist/mo-phong/core.mjs
          test -f dist/data/mo-phong-120-media.json
      - name: Verify emergency login recovery is present
        run: |
          grep -F '/rpc-preflight.js?v=20260902-1' dist/index.html
          grep -F 'PROXY_MARKER="same-origin-v4"' dist/rpc-preflight.js
          grep -F 'version:"20260902-1"' dist/rpc-preflight.js
