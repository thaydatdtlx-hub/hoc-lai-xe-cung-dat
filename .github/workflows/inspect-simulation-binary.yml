name: Inspect authorized simulation binary

on:
  push:
    branches: [fix/simulation-account-sync]
    paths:
      - .github/workflows/inspect-simulation-binary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract file binutils
          python -m pip install --disable-pip-version-check gdown
      - name: Download first authorized cabinet
        run: |
          gdown 'https://drive.google.com/uc?id=1P3whOKPu0GzPJ4ZbWwkDcu-Lo8lUQMeM' -O Setup1.cab
          test "$(stat -c%s Setup1.cab)" -gt 600000000
      - name: Extract application executable
        run: |
          mkdir -p extracted diagnostics
          cabextract -l Setup1.cab > diagnostics/setup1-list.txt
          grep -i 'OnTapMoPhong.exe' diagnostics/setup1-list.txt
          cabextract -q -d extracted -F 'OnTapMoPhong.exe' Setup1.cab
          exe=$(find extracted -type f -iname 'OnTapMoPhong.exe' -print -quit)
          test -n "$exe"
          file "$exe" | tee diagnostics/file.txt
          sha256sum "$exe" | tee diagnostics/sha256.txt
          strings -a -n 5 "$exe" > diagnostics/strings-ascii.txt
          strings -a -el -n 5 "$exe" > diagnostics/strings-utf16.txt
      - uses: actions/upload-artifact@v4
        with:
          name: authorized-simulation-binary-inspection
          path: |
            extracted/OnTapMoPhong.exe
            diagnostics/
          retention-days: 1
          if-no-files-found: error
