# trigger 2026-09-09
name: Redesign theory progress

on:
  push:
    paths:
      - '.github/workflows/redesign-theory-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old theory progress block
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html_path = Path('hoc-vien.html')
          css_path = Path('student.css')
          js_path = Path('student.js')

          html = html_path.read_text(encoding='utf-8')
          new_section = '''<section class="portal-section theory-account-section" aria-labelledby="theoryAccountHeading">
            <div class="section-heading theory-account-heading">
              <div><p>LÝ THUYẾT 600 CÂU</p><h2 id="theoryAccountHeading">Tiến độ học của tôi</h2></div>
              <a href="/600-cau-hoi.html">Tiếp tục học →</a>
            </div>
            <div class="theory-progress-layout">
              <article class="theory-progress-summary">
                <div id="theoryProgressRing" class="theory-progress-ring" role="img" aria-label="Đã học 0%">
                  <div><span aria-hidden="true">▤</span></div>
                </div>
                <div class="theory-progress-copy">
                  <strong id="theoryPercent">0%</strong>
                  <small>Đã học</small>
                  <b id="theoryLearned">0/600 câu</b>
                </div>
              </article>
              <div class="theory-progress-detail">
                <div class="theory-account-grid theory-account-grid--new">
                  <article id="theoryCorrectCard" class="theory-metric-card metric-correct"><span>✓</span><div><small>Trả lời đúng</small><strong id="theoryCorrect">0 câu</strong></div><i><b></b></i></article>
                  <article id="theoryWrongCard" class="theory-metric-card metric-wrong"><span>×</span><div><small>Trả lời sai</small><strong id="theoryWrong">0 câu</strong></div><i><b></b></i></article>
                  <article id="theoryExamCard" class="theory-metric-card metric-exam"><span>⇄</span><div><small>Số lần thi thử</small><strong id="theoryExamCount">0 lần</strong></div><i><b></b></i></article>
                  <article id="theoryBestCard" class="theory-metric-card metric-best"><span>★</span><div><small>Kết quả tốt nhất</small><strong id="theoryBestScore">Chưa thi</strong></div><i><b></b></i></article>
                </div>
                <div id="theoryLatestExam" class="theory-latest-exam"><span>i</span><p>Hãy bắt đầu học và thi thử để Admin có thể theo dõi, hỗ trợ quá trình ôn tập.</p></div>
              </div>
            </div>
          </section>'''
          html, count = re.subn(r'<section class="portal-section theory-account-section" aria-labelledby="theoryAccountHeading">.*?</section>', new_section, html, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'Không tìm thấy đúng 1 khối tiến độ cũ (found={count})')
          html = re.sub(r'href="/student\.css(?:\?[^\"]*)?"', 'href="/student.css?v=20260909-1"', html, count=1)
          html = re.sub(r'src="/student\.js(?:\?[^\"]*)?"', 'src="/student.js?v=20260909-1"', html, count=1)
          html_path.write_text(html, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          new_css = r'''.theory-account-section{overflow:hidden;background:linear-gradient(135deg,#fff,#f8fbff)}
.theory-account-heading{align-items:center;margin-bottom:16px}.theory-account-heading a{padding:9px 13px;border:1px solid #d7e8f8;border-radius:11px;background:#e8f4ff;color:#126ac2;font-size:9px;font-weight:900;text-decoration:none;transition:.18s ease}.theory-account-heading a:hover{transform:translateY(-1px);background:#dcedff;box-shadow:0 7px 18px #176bc41a}
.theory-progress-layout{display:grid;grid-template-columns:minmax(285px,.85fr) minmax(0,2.65fr);gap:14px;align-items:stretch}.theory-progress-summary{display:flex;min-width:0;align-items:center;gap:18px;padding:18px;border:1px solid #dce8f3;border-radius:17px;background:linear-gradient(145deg,#fff,#fbfdff);box-shadow:0 8px 22px #25557b0b}.theory-progress-ring{--theory-progress:0;position:relative;display:grid;width:112px;aspect-ratio:1;place-items:center;flex:0 0 auto;border-radius:50%;background:conic-gradient(#2b7ff0 calc(var(--theory-progress)*1%),#e4ecf4 0);box-shadow:0 8px 22px #1c6ec018}.theory-progress-ring:before{content:"";position:absolute;width:84px;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 9px #eef6ff}.theory-progress-ring>div{position:relative;z-index:1;display:grid;width:54px;aspect-ratio:1;place-items:center;border-radius:16px;background:#e8f3ff;color:#1972d2;font-size:24px;font-weight:950;box-shadow:0 5px 14px #1e6dbb12}.theory-progress-copy{display:grid;min-width:0;gap:3px}.theory-progress-copy>strong{color:#1269d0;font-size:29px;line-height:1;font-weight:950;letter-spacing:-.04em}.theory-progress-copy>small{color:#72879b;font-size:10px;font-weight:850}.theory-progress-copy>b{margin-top:4px;color:#506f90;font-size:13px;font-weight:900}.theory-progress-detail{display:grid;min-width:0;gap:11px}.theory-account-grid--new{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.theory-metric-card{--metric-progress:0;position:relative;display:grid;grid-template-columns:42px minmax(0,1fr);grid-template-rows:auto 5px;align-items:center;gap:8px 10px;min-width:0;padding:13px 13px 12px;border:1px solid #dce8f3;border-radius:15px;background:#fff;box-shadow:0 6px 18px #244f7608}.theory-metric-card>span{display:grid;width:42px;height:42px;grid-row:1;place-items:center;border-radius:12px;font-size:21px;font-weight:900}.theory-metric-card>div{display:grid;min-width:0;gap:3px}.theory-metric-card small{color:#74899d;font-size:8px;font-weight:850}.theory-metric-card strong{overflow:hidden;color:#244f78;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.theory-metric-card>i{grid-column:1/-1;display:block;height:5px;overflow:hidden;border-radius:999px;background:#edf2f7}.theory-metric-card>i>b{display:block;width:calc(var(--metric-progress)*1%);height:100%;border-radius:inherit;background:currentColor;transition:width .35s ease}.metric-correct{color:#14a36f}.metric-correct>span{background:#dcf7eb;color:#0c8d63}.metric-correct>i{background:#e2f7ef}.metric-wrong{color:#ef6a65}.metric-wrong>span{background:#ffe5e3;color:#dc4e49}.metric-wrong>i{background:#feeae8}.metric-exam{color:#7d5be8}.metric-exam>span{background:#eee7ff;color:#6b49d7}.metric-exam>i{background:#f0ebff}.metric-best{color:#d89518}.metric-best>span{background:#fff0cf;color:#b8730c}.metric-best>i{background:#fff1d4}.theory-latest-exam{display:flex;align-items:center;gap:10px;margin:0;padding:11px 13px;border:1px solid #d7e8f7;border-radius:13px;background:#eaf4ff;color:#426b90}.theory-latest-exam>span{display:grid;width:28px;height:28px;place-items:center;flex:0 0 auto;border-radius:50%;background:#fff;color:#1671c6;font-weight:950}.theory-latest-exam p{margin:0;font-size:9px;line-height:1.5}.theory-latest-exam.passed{border-color:#cfeadc;background:#e7f8f0;color:#21694f}.theory-latest-exam.passed>span{color:#08805a}.theory-latest-exam.failed,.theory-latest-exam.warning{border-color:#f0d8cf;background:#fff0eb;color:#8e4937}.theory-latest-exam.failed>span,.theory-latest-exam.warning>span{color:#be4d32}
@media(max-width:980px){.theory-progress-layout{grid-template-columns:1fr}.theory-progress-summary{justify-content:center}.theory-account-grid--new{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.theory-account-section{padding:17px}.theory-account-heading{align-items:flex-end}.theory-account-heading h2{font-size:18px}.theory-account-heading a{padding:8px 10px;white-space:nowrap}.theory-progress-summary{justify-content:flex-start;padding:15px}.theory-progress-ring{width:96px}.theory-progress-ring:before{width:72px}.theory-progress-ring>div{width:48px;border-radius:14px;font-size:21px}.theory-progress-copy>strong{font-size:25px}.theory-account-grid--new{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.theory-metric-card{grid-template-columns:38px minmax(0,1fr);padding:11px}.theory-metric-card>span{width:38px;height:38px;font-size:18px}.theory-metric-card strong{font-size:12px}}
@media(max-width:390px){.theory-account-grid--new{grid-template-columns:1fr}.theory-progress-summary{gap:14px}.theory-progress-ring{width:88px}.theory-progress-ring:before{width:66px}.theory-progress-copy>strong{font-size:23px}}'''
          css, count = re.subn(r'\.theory-account-section\{.*?(?=\n\.portal-section\{)', new_css + '\n', css, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'Không tìm thấy đúng 1 cụm CSS tiến độ cũ (found={count})')
          css_path.write_text(css, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          new_fn = r'''function renderTheoryProgress(){
  const summary=theoryProgress||{};
  const totalQuestions=600;
  const answered=Math.max(0,Math.min(totalQuestions,Number(summary.answered_count)||0));
  const correct=Math.max(0,Math.min(answered,Number(summary.correct_count)||0));
  const wrong=Math.max(0,answered-correct);
  const examCount=Math.max(0,Number(summary.exam_count)||0);
  const rawPercent=totalQuestions?answered/totalQuestions*100:0;
  const percentLabel=rawPercent>=99.95?"100%":`${rawPercent.toFixed(1).replace(/\.0$/,"")}%`;
  $("theoryLearned").textContent=`${answered}/600 câu`;
  $("theoryPercent").textContent=percentLabel;
  $("theoryCorrect").textContent=`${correct} câu`;
  $("theoryWrong").textContent=`${wrong} câu`;
  $("theoryExamCount").textContent=`${examCount} lần`;
  $("theoryBestScore").textContent=summary.best_total?`${summary.best_score}/${summary.best_total}`:"Chưa thi";
  const ring=$("theoryProgressRing");
  if(ring){ring.style.setProperty("--theory-progress",String(Math.max(0,Math.min(100,rawPercent))));ring.setAttribute("aria-label",`Đã học ${percentLabel}`)}
  const setMetric=(id,value)=>$(id)?.style.setProperty("--metric-progress",String(Math.max(0,Math.min(100,value))));
  setMetric("theoryCorrectCard",answered?correct/answered*100:0);
  setMetric("theoryWrongCard",answered?wrong/answered*100:0);
  setMetric("theoryExamCard",Math.min(100,examCount*10));
  setMetric("theoryBestCard",summary.best_total?Number(summary.best_score||0)/Number(summary.best_total)*100:0);
  if(!theoryFeatureAvailable){$("theoryLatestExam").className="theory-latest-exam warning";$("theoryLatestExam").innerHTML="<span>!</span><p>Hệ thống đồng bộ tiến độ đang được Admin cập nhật. Bạn vẫn có thể học trên thiết bị này.</p>";return;}
  const latest=summary.latest_exam;
  if(!latest){$("theoryLatestExam").className="theory-latest-exam";$("theoryLatestExam").innerHTML="<span>i</span><p>Hãy bắt đầu học và thi thử để Admin có thể theo dõi, hỗ trợ quá trình ôn tập.</p>";return;}
  $("theoryLatestExam").className=`theory-latest-exam ${latest.passed?"passed":"failed"}`;
  $("theoryLatestExam").innerHTML=`<span>${latest.passed?"✓":"!"}</span><p><strong>Bài thi gần nhất: hạng ${esc(latest.license_class)} · ${Number(latest.score)||0}/${Number(latest.total)||0}</strong><br>${latest.passed?"Đạt yêu cầu":"Chưa đạt"} · ${esc(date(latest.submitted_at,true))}${latest.critical_correct?"":" · Sai câu điểm liệt"}</p>`;
}'''
          js, count = re.subn(r'function renderTheoryProgress\(\)\{.*?\n\}\nfunction availableSlots', new_fn + '\nfunction availableSlots', js, count=1, flags=re.S)
          if count != 1: raise SystemExit(f'Không tìm thấy đúng 1 hàm renderTheoryProgress (found={count})')
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit website changes
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/redesign-theory-progress.yml
          git add hoc-vien.html student.css student.js
          git diff --cached --check
          git commit -m "Thay giao diện tiến độ học lý thuyết"
          git push origin main
