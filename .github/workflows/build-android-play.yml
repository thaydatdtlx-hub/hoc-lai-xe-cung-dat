name: Build Android CH Play
on:
  push:
    branches: [android-play-release-20261125]
    paths:
      - 'android-play/**'
      - '.github/workflows/build-android-play.yml'
      - '.github/workflows/test-android-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure JDK and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK" "platforms;android-36" "build-tools;35.0.0"
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          curl --fail --location --retry 3 -o gradle.sha256 https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256
          printf '%s  gradle.zip\n' "$(cat gradle.sha256)" | sha256sum -c -
          unzip -q gradle.zip
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Validate release configuration
        run: node android-play/scripts/validate-release.mjs
      - name: Build and lint
        working-directory: android-play
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleSideload :app:lintSideload :app:assembleDebug
      - name: Prepare local signing utilities
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p android-play/signing-tools
          cp "$SDK/build-tools/35.0.0/lib/apksigner.jar" android-play/signing-tools/
          cp "$SDK/build-tools/35.0.0/zipalign" android-play/signing-tools/
          ldd "$SDK/build-tools/35.0.0/zipalign" || true
      - name: Upload unsigned sideload APK and local signing tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hoc-lai-xe-cung-dat-android-1.1.3-unsigned
          path: |
            android-play/app/build/outputs/apk/sideload/app-sideload-unsigned.apk
            android-play/signing-tools/apksigner.jar
            android-play/signing-tools/zipalign
            android-play/app/build/reports/lint-results-sideload.html
          if-no-files-found: error
          retention-days: 14
      - name: Upload separately installable debug test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hoc-lai-xe-cung-dat-android-1.1.3-test
          path: android-play/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test-android-emulator.yml
