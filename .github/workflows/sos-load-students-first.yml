name: Fix premium profile build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore canonical student stylesheet path
        shell: bash
        run: |
          python3 -S <<'PY'
          from pathlib import Path
          p=Path('hoc-vien.html')
          s=p.read_text(encoding='utf-8')
          old='href="/student.css?v=20260909-hero-v3"'
          if old not in s:
              raise SystemExit('Không tìm thấy đường dẫn CSS cần sửa')
          s=s.replace(old,'href="/student.css"',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Restore workflow and commit
        shell: bash
        run: |
          GOOD=84a959399b9fd044eb8b6f4c7750646a60e0aa21
          git checkout "$GOOD" -- .github/workflows/sos-load-students-first.yml
          git rm -f .github/verify-premium-hero.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoc-vien.html .github/workflows/sos-load-students-first.yml
          git diff --cached --check
          git commit -m "Hoàn tất giao diện hồ sơ học viên premium"
          git pull --rebase origin main
          git push origin main
