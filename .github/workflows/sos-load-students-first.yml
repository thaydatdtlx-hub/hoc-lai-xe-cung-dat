name: Apply premium student profile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old profile interface
        shell: bash
        run: |
          rm -f sitecustomize.py
          python3 -S <<'PY'
          from pathlib import Path
          import re

          html_path = Path('hoc-vien.html')
          source_path = Path('.github/workflows/unify-admin-toolbar.yml')
          html = html_path.read_text(encoding='utf-8')
          source = source_path.read_text(encoding='utf-8')

          match = re.search(r"hero=r'''(.*?)'''", source, flags=re.S)
          if not match:
              raise SystemExit('Không tìm thấy mẫu giao diện premium đã duyệt')
          hero = match.group(1)

          html, count = re.subn(
              r'<section class="student-hero">.*?</section>',
              lambda _: hero,
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Không tìm thấy đúng 1 giao diện hồ sơ cũ (found={count})')

          required = [
              'id="studentPhoto"', 'id="studentPhotoPlaceholder"',
              'id="studentName"', 'id="studentCode"',
              'id="studentCourse"', 'id="studentLicense"',
              'id="studentDrivingRefreshCta"', 'id="studentDrivingRefreshStatus"'
          ]
          for token in required:
              if html.count(token) != 1:
                  raise SystemExit(f'ID động không hợp lệ sau khi thay: {token}')

          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Restore helper files and commit
        shell: bash
        run: |
          GOOD=84a959399b9fd044eb8b6f4c7750646a60e0aa21
          git checkout "$GOOD" -- \
            .github/workflows/sos-load-students-first.yml \
            .github/workflows/unify-admin-toolbar.yml \
            .github/workflows/verify-production-build.yml \
            .github/workflows/apply-toolbar-icons-v2.yml \
            .github/workflows/bump-toolbar-css.yml
          git rm -f sitecustomize.py || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoc-vien.html \
            .github/workflows/sos-load-students-first.yml \
            .github/workflows/unify-admin-toolbar.yml \
            .github/workflows/verify-production-build.yml \
            .github/workflows/apply-toolbar-icons-v2.yml \
            .github/workflows/bump-toolbar-css.yml
          git diff --cached --check
          git commit -m "Xóa giao diện hồ sơ cũ và thay bằng giao diện mới"
          git pull --rebase origin main
          git push origin main
