name: Analyze simulation update
on:
  push:
    branches: [docs/simulation-media-source-audit]
    paths: [.github/workflows/analyze-simulation-update.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar binutils
          python -m pip install --disable-pip-version-check gdown
      - name: Inspect update payload
        run: |
          mkdir -p update report
          gdown 'https://drive.google.com/uc?id=1lteAIGUPs2yQRN-ds2A62G7tghEcZ2d7' -O update.rar
          unrar x -o+ update.rar update/
          find update -type f -printf '%P\t%s\n' | sort | tee report/files.txt
          find update -type f -exec sha256sum {} \; > report/sha256.txt
          EXE=$(find update -type f -iname 'OnTapMoPhong.exe' | head -1)
          LC4=$(find update -type f -name 'lc4' | head -1)
          strings -a "$EXE" | grep -Ei 'rank_score|milestone|score|select \* from video|tss.db|SQLITECIPHER|chacha|duration|start|end|^[0-9a-f]{32,}$' > report/relevant-strings.txt || true
          xxd "$LC4" > report/lc4.hex
          strings -a "$LC4" > report/lc4.txt || true
          cat report/files.txt report/lc4.hex report/lc4.txt
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-update-analysis
          path: report/
          retention-days: 1
