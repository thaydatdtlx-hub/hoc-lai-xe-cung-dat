name: Verify simulation storage upload
on:
  push:
    branches: [docs/simulation-media-source-audit]
    paths: [.github/workflows/publish-simulation-smoke.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  id-token: write
env:
  UPLOAD_FUNCTION: https://pkzxkvcncipfszeukpwu.supabase.co/functions/v1/simulation-media-upload
  ANALYSIS_RUN_ID: '34941389837'
  ANALYSIS_ARTIFACT: simulation-package-analysis
jobs:
  smoke-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ANALYSIS_RUN_ID }}
          name: ${{ env.ANALYSIS_ARTIFACT }}
          path: analysis
      - name: Verify validated MP4 artifact
        run: |
          test -s analysis/extracted/first-scenario.mp4
          test $(stat -c%s analysis/extracted/first-scenario.mp4) -gt 1000000
      - name: Upload scenario 001 to storage
        run: |
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=simulation-media-upload"
          OIDC=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" | jq -r .value)
          resp=$(curl -fsSL -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' --data '{"id":1}' "$UPLOAD_FUNCTION")
          signed=$(echo "$resp" | jq -r .signedUrl)
          test -n "$signed" -a "$signed" != null
          curl -fsSL -X PUT -H 'content-type: video/mp4' -H 'cache-control: max-age=31536000' --data-binary @analysis/extracted/first-scenario.mp4 "$signed" >/dev/null
      - name: Verify public object
        run: |
          curl -fsSI https://pkzxkvcncipfszeukpwu.supabase.co/storage/v1/object/public/simulation-120/v2/001.mp4 | grep -E 'HTTP/.* 200|content-type: video/mp4'
