name: Android emulator smoke test
on:
  push:
    branches: [android-play-release-20261125]
    paths:
      - '.github/workflows/test-android-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Retrieve the two successful builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old-apk" "$RUNNER_TEMP/new-apk" "$RUNNER_TEMP/qa"
          gh run download 45530983277 --repo "$GITHUB_REPOSITORY" --name hoc-lai-xe-cung-dat-android-1.1.2 --dir "$RUNNER_TEMP/old-apk"
          gh run download 45602386320 --repo "$GITHUB_REPOSITORY" --name hoc-lai-xe-cung-dat-android-1.1.3-unsigned --dir "$RUNNER_TEMP/new-apk"
          old="$(find "$RUNNER_TEMP/old-apk" -name app-sideload-unsigned.apk -type f -print -quit)"
          new="$(find "$RUNNER_TEMP/new-apk" -name app-sideload-unsigned.apk -type f -print -quit)"
          test -s "$old"
          test -s "$new"
          cp "$old" "$RUNNER_TEMP/qa/old-unsigned.apk"
          cp "$new" "$RUNNER_TEMP/qa/new-unsigned.apk"
      - name: Prepare KVM and signing tools
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          manager="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$manager"
          "$manager" --sdk_root="$SDK" "build-tools;35.0.0" "platform-tools"
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Sign both versions with one disposable test key
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qa"
          keytool -genkeypair -keystore qa.p12 -storetype PKCS12 -storepass temporaryqa123 -keypass temporaryqa123 -alias qa -keyalg RSA -keysize 2048 -validity 2 -dname "CN=HLD emulator QA only"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          for version in old new; do
            "$tools/zipalign" -f 4 "$version-unsigned.apk" "$version-aligned.apk"
            "$tools/apksigner" sign --ks qa.p12 --ks-key-alias qa --ks-pass pass:temporaryqa123 --key-pass pass:temporaryqa123 --out "$version-test.apk" "$version-aligned.apk"
            "$tools/apksigner" verify --verbose "$version-test.apk"
          done
          "$tools/aapt" dump badging old-test.apk > old-badging.txt
          "$tools/aapt" dump badging new-test.apk > new-badging.txt
          grep -q "name='com.hoclaixecungdat.app' versionCode='4' versionName='1.1.2'" old-badging.txt
          grep -q "name='com.hoclaixecungdat.app' versionCode='5' versionName='1.1.3'" new-badging.txt
          rm -f qa.p12
      - name: Prepare emulator smoke script
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qa"
          cat > "$RUNNER_TEMP/qa/smoke.sh" <<'HLD_SMOKE'
          set -euo pipefail
          cd "$RUNNER_TEMP/qa"
          pkg=com.hoclaixecungdat.app
          adb install old-test.apk | tee install-old.txt
          grep -q Success install-old.txt
          adb shell dumpsys package "$pkg" > old-installed.txt
          grep -q 'versionName=1.1.2' old-installed.txt
          adb install -r new-test.apk | tee upgrade.txt
          grep -q Success upgrade.txt
          adb shell dumpsys package "$pkg" > new-installed.txt
          grep -q 'versionName=1.1.3' new-installed.txt
          grep -q 'versionCode=5' new-installed.txt
          echo 'PASS: install and upgrade using identical disposable signing certificate'
          echo 'PASS: installed application package and version metadata'
          adb shell pm path com.android.chrome
          adb shell cmd role add-role-holder android.app.role.BROWSER com.android.chrome || true
          set -euo pipefail
          cd "$RUNNER_TEMP/qa"
          pkg=com.hoclaixecungdat.app
          adb logcat -c
          adb shell am force-stop "$pkg"
          adb shell am start -W -n "$pkg/.UpdateActivity" | tee launch.txt
          grep -q 'Status: ok' launch.txt
          sleep 12
          adb shell dumpsys activity activities > activities.txt
          adb logcat -d -v brief > logcat.txt
          adb exec-out screencap -p > launch.png
          if grep -A 8 'FATAL EXCEPTION' logcat.txt | grep -q "Process: $pkg,"; then
            echo 'FAIL: native crash after startup'; exit 1
          fi
          if ! grep -E 'mResumedActivity|topResumedActivity' activities.txt | grep -q 'com.android.chrome'; then
            echo 'FAIL: Chrome is not resumed'; exit 1
          fi
          echo 'PASS: native startup and Chrome handoff on Android 14'
          adb shell am force-stop "$pkg"
          HLD_SMOKE
      - name: Run Android 14 emulator using reviewed pinned runner
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          avd-name: hld-qa
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -feature -Vulkan
          disable-animations: true
          script: bash "$RUNNER_TEMP/qa/smoke.sh"
      - name: Record scope of evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          printf '%s\n' 'Android 14 emulator only. Upgrade used an ephemeral QA key, NOT the original signing key. No real user credentials or production writes. Login, delivery and original signing compatibility are not certified.' > "$RUNNER_TEMP/qa/limitations.txt"
      - name: Upload emulator evidence (no APK or signing key)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-1.1.3-emulator-evidence
          path: |
            ${{ runner.temp }}/qa/limitations.txt
            ${{ runner.temp }}/qa/install-old.txt
            ${{ runner.temp }}/qa/upgrade.txt
            ${{ runner.temp }}/qa/launch.txt
            ${{ runner.temp }}/qa/launch.png
            ${{ runner.temp }}/qa/activities.txt
            ${{ runner.temp }}/qa/logcat.txt
            ${{ runner.temp }}/qa/old-badging.txt
            ${{ runner.temp }}/qa/new-badging.txt
          if-no-files-found: warn
          retention-days: 7
