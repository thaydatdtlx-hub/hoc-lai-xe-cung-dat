name: Publish built simulation media
on:
  workflow_run:
    workflows: ["Build simulation media artifacts"]
    types: [completed]
  push:
    branches: [docs/simulation-media-source-audit]
    paths: [.github/workflows/publish-built-simulation-media.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  id-token: write
env:
  UPLOAD_FUNCTION: https://pkzxkvcncipfszeukpwu.supabase.co/functions/v1/simulation-media-upload
  PUBLIC_MEDIA_BASE: https://pkzxkvcncipfszeukpwu.supabase.co/storage/v1/object/public/simulation-120/v2
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve media build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            test "$EVENT_CONCLUSION" = "success"
            test -n "$EVENT_RUN_ID"
            test -n "$EVENT_BRANCH"
            echo "BUILD_RUN_ID=$EVENT_RUN_ID" >> "$GITHUB_ENV"
            echo "TARGET_BRANCH=$EVENT_BRANCH" >> "$GITHUB_ENV"
            exit 0
          fi

          branch="$CURRENT_BRANCH"
          test -n "$branch"
          encoded=$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-simulation-media.yml/runs?branch=${encoded}&per_page=10"
          for i in $(seq 1 510); do
            json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api")
            run=$(echo "$json" | jq -c '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              echo "no media build found yet for $branch"
              sleep 20
              continue
            fi
            id=$(echo "$run" | jq -r .id)
            status=$(echo "$run" | jq -r .status)
            conclusion=$(echo "$run" | jq -r .conclusion)
            echo "media build $id: $status / $conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              echo "BUILD_RUN_ID=$id" >> "$GITHUB_ENV"
              echo "TARGET_BRANCH=$branch" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}
          pattern: simulation-media-*
          merge-multiple: true
          path: media

      - name: Verify 120 videos
        run: |
          total=$(find media -type f -name 'chapter*_th*.mp4' | wc -l)
          echo "downloaded videos: $total"
          test "$total" -eq 120
          du -sh media

      - name: Upload media to project storage
        run: |
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=simulation-media-upload"
          OIDC=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" | jq -r .value)
          while IFS= read -r -d '' f; do
            id=$(basename "$f" .mp4 | sed -E 's/.*_th([0-9]+)$/\1/')
            test "$id" -ge 1 -a "$id" -le 120
            resp=$(curl -fsSL -H "Authorization: Bearer $OIDC" -H 'content-type: application/json' --data "{\"id\":$id}" "$UPLOAD_FUNCTION")
            signed=$(echo "$resp" | jq -r .signedUrl)
            test -n "$signed" -a "$signed" != null
            curl -fsSL -X PUT -H 'content-type: video/mp4' -H 'cache-control: max-age=31536000' --data-binary @"$f" "$signed" >/dev/null
            printf 'uploaded %03d\n' "$id"
          done < <(find media -type f -name 'chapter*_th*.mp4' -print0 | sort -z)

      - name: Build production manifest
        run: |
          python - <<'PY'
          import json, os
          src=json.load(open('public/data/mo-phong-120-timing-source.json',encoding='utf-8'))
          base=os.environ['PUBLIC_MEDIA_BASE']; scenarios=[]
          for x in src['scenarios']:
              start=float(x['dangerStart']); end=float(x['dangerEnd']); step=(end-start)/5
              windows=[{'score':score,'start':round(start+i*step,3),'end':round(start+(i+1)*step,3)} for i,score in enumerate((5,4,3,2,1))]
              scenarios.append({'id':x['id'],'chapter':x['chapter'],'title':x['title'],'videoUrl':f"{base}/{x['id']:03d}.mp4",'durationSeconds':round(x['durationMilliseconds']/1000,3),'scoreWindows':windows,'source':{'url':'https://drive.google.com/drive/folders/1AdpFdu_pHIV9rmagkSb1CFcdkjRX2qTO','version':'OnTapMoPhongSetup v2.0.0 x64','rightsReference':'owner-confirmed-authorized-package'}})
          out={'version':'2.0.0-web-2026-09-17','note':'dangerStart and dangerEnd are verified directly against tss.db; the 5→1 training bands are evenly interpolated between those source markers because tss.db contains no separate score-boundary columns.','scoringMethod':'linear-interpolation-between-source-start-end','scenarios':scenarios}
          with open('public/data/mo-phong-120-media.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          node scripts/test-simulation-media.mjs
          node --check public/mo-phong/core.mjs
          node --check public/mo-phong/app.mjs

      - name: Commit production manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/mo-phong-120-media.json
          if git diff --cached --quiet; then
            echo "production manifest is already current"
            exit 0
          fi
          git commit -m 'data: publish 120 simulation media URLs'
          git push origin "HEAD:${TARGET_BRANCH}"
