name: Apply student dashboard redesign

on:
  push:
    branches: [main]
    paths:
      - .github/toolbar-css-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace student hero and attendance UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          html_path=Path('hoc-vien.html')
          css_path=Path('student.css')
          js_path=Path('student.js')
          html=html_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')
          js=js_path.read_text(encoding='utf-8')

          hero='''<section class="student-hero student-hero-v3">
            <div class="student-profile-showcase">
              <div class="student-hero-scenery" aria-hidden="true">
                <svg viewBox="0 0 900 360" preserveAspectRatio="none">
                  <defs>
                    <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9f6ff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
                    <linearGradient id="heroRoad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dcecff"/><stop offset="1" stop-color="#a9d4ff"/></linearGradient>
                  </defs>
                  <path d="M420 0H900V360H330c170-62 268-124 292-185C645 115 576 55 420 0Z" fill="url(#heroSky)"/>
                  <g fill="#b9daf4" opacity=".38"><rect x="600" y="126" width="24" height="91" rx="3"/><rect x="630" y="94" width="36" height="123" rx="3"/><rect x="674" y="118" width="28" height="99" rx="3"/><rect x="710" y="76" width="43" height="141" rx="3"/><rect x="762" y="108" width="27" height="109" rx="3"/><rect x="797" y="89" width="52" height="128" rx="3"/></g>
                  <path d="M436 360c120-80 227-121 464-141v141H436Z" fill="url(#heroRoad)" opacity=".8"/>
                  <path d="M510 354c83-54 168-85 318-110" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="36 27" opacity=".8"/>
                  <g transform="translate(703 225)" opacity=".82"><path d="M18 50h118c10 0 18 8 18 18v16H0V68c0-10 8-18 18-18Z" fill="#fff" stroke="#75b3ec" stroke-width="3"/><path d="M31 50 49 20h66l20 30" fill="#eaf6ff" stroke="#75b3ec" stroke-width="3"/><path d="M54 24h53l15 25H39Z" fill="#bfe1fb"/><circle cx="30" cy="84" r="13" fill="#315e83"/><circle cx="126" cy="84" r="13" fill="#315e83"/><path d="M17 63h20M117 63h20" stroke="#3f8ed3" stroke-width="5" stroke-linecap="round"/></g>
                </svg>
              </div>
              <div class="student-profile-content">
                <div class="student-photo-wrap student-photo-wrap-v3"><img id="studentPhoto" class="hidden" alt="Ảnh học viên"><span id="studentPhotoPlaceholder">HV</span><i aria-hidden="true">✓</i></div>
                <div class="student-heading student-heading-v3">
                  <p><span aria-hidden="true">▣</span> HỒ SƠ ĐÀO TẠO CÁ NHÂN</p>
                  <h1 id="studentName">Học viên</h1>
                  <div class="student-profile-facts">
                    <span class="student-fact"><i aria-hidden="true">◎</i><small>Mã học viên</small><strong id="studentCode">Chưa có mã</strong></span>
                    <span class="student-fact fact-course"><i aria-hidden="true">◆</i><small>Khóa học</small><strong id="studentCourse">Chưa có khóa</strong></span>
                    <span class="student-fact fact-license"><i aria-hidden="true">▰</i><small>Hạng giấy phép</small><strong id="studentLicense">Chưa có hạng</strong></span>
                  </div>
                  <div class="student-hero-quote"><b>“</b><span>Chúc bạn luôn vững tay lái, tự tin trên mọi hành trình!</span></div>
                </div>
              </div>
              <div class="student-hero-motto" aria-hidden="true"><b>HỌC AN TOÀN</b><span>•</span><b>LÁI VỮNG VÀNG</b><span>•</span><b>KIẾN TẠO TƯƠNG LAI</b></div>
            </div>
            <div class="student-hero-actions student-hero-actions-v3">
              <a class="schedule-cta hero-action-card hero-action-schedule" href="/lich-dao-tao.html"><span class="hero-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18M8 14h3M13 14h3"/></svg></span><div><strong>Xem lịch đào tạo</strong><small>Lịch học và lịch thi của tôi</small></div><b class="hero-action-arrow">→</b></a>
              <a class="schedule-cta theory-cta hero-action-card hero-action-theory" href="/600-cau-hoi.html"><span class="hero-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H11v17H7.5A3.5 3.5 0 0 0 4 22V5.5ZM20 5.5A3.5 3.5 0 0 0 16.5 2H13v17h3.5A3.5 3.5 0 0 1 20 22V5.5Z"/></svg></span><div><strong>Học lý thuyết</strong><small>Ôn tập và thi thử A1 · A · B · C1</small></div><b class="hero-action-arrow">→</b></a>
              <a id="studentDrivingRefreshCta" class="schedule-cta driving-refresh-cta student-refresh-access is-locked hero-action-card hero-action-refresh" href="/bo-tuc-tay-lai.html#tinh-chi-phi" aria-disabled="true"><span class="hero-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2"/><path d="M4.5 10h5l2.5 2M19.5 10h-5L12 12M12 14v6"/></svg></span><div><strong>Đăng ký bổ túc tay lái</strong><small id="studentDrivingRefreshStatus">Tính năng mở khi Admin ghi nhận đã nhận bằng lái</small></div><b class="hero-action-arrow">→</b></a>
            </div>
          </section>'''

          html,n=re.subn(r'<section class="student-hero">.*?</section>',hero,html,count=1,flags=re.S)
          if n!=1 and 'student-hero-v3' not in html:
              raise SystemExit(f'Không tìm thấy giao diện hồ sơ cũ (found={n})')

          hero_css=r'''.student-hero{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(310px,.85fr);gap:16px;padding:13px;border:1px solid #d5e7f6;border-radius:26px;background:linear-gradient(135deg,#f8fcff,#edf7ff);box-shadow:0 18px 46px #164f7c18;color:#16395f}.student-profile-showcase{position:relative;min-height:315px;overflow:hidden;border:1px solid #d6e9f8;border-radius:21px;background:linear-gradient(135deg,#eff8ff 0%,#fff 50%,#eaf6ff 100%);isolation:isolate}.student-profile-showcase:before{content:"";position:absolute;left:-90px;top:-105px;width:280px;height:280px;border:40px solid #74b6f430;border-radius:50%;z-index:-1}.student-profile-showcase:after{content:"";position:absolute;left:-10%;bottom:-88px;width:62%;height:155px;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#9ed0ff70,#5eacf140);transform:rotate(3deg);z-index:-1}.student-hero-scenery{position:absolute;inset:0;z-index:-2;pointer-events:none}.student-hero-scenery svg{display:block;width:100%;height:100%}.student-profile-content{position:relative;z-index:2;display:flex;align-items:center;gap:27px;min-height:275px;padding:30px 34px 46px}.student-photo-wrap{position:relative;display:grid;width:170px;height:205px;overflow:visible;place-items:center;flex:0 0 auto;border:7px solid #fff;border-radius:28px;background:#eef7ff;color:#1974cb;font-size:27px;font-weight:950;box-shadow:0 17px 36px #185b8f24}.student-photo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:20px}.student-photo-wrap>span{display:grid;width:100%;height:100%;place-items:center;border-radius:20px;background:linear-gradient(145deg,#e5f3ff,#fff)}.student-photo-wrap>i{position:absolute;right:-13px;bottom:-13px;display:grid;width:48px;height:48px;place-items:center;border:5px solid #fff;border-radius:50%;background:#2f83e8;color:#fff;font-size:17px;font-style:normal;box-shadow:0 7px 18px #1f6fb53b}.student-heading{min-width:0;flex:1}.student-heading p{display:flex;align-items:center;gap:8px;margin:0 0 11px;color:#1979db;font-size:10px;font-weight:950;letter-spacing:.13em}.student-heading p span{font-size:17px}.student-heading h1{max-width:680px;margin:0 0 18px;color:#0d2d55;font-size:clamp(29px,3.2vw,49px);line-height:1.04;letter-spacing:-.035em}.student-profile-facts{display:flex;flex-wrap:wrap;gap:9px}.student-fact{display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;min-width:145px;gap:1px 9px;padding:10px 13px;border:1px solid #d8e9f7;border-radius:15px;background:#ffffffd9;box-shadow:0 6px 17px #1c5a8d0b}.student-fact>i{display:grid;width:36px;height:36px;grid-row:1/3;place-items:center;border-radius:11px;background:#e7f2ff;color:#2077d4;font-size:16px;font-style:normal;font-weight:950}.student-fact small{align-self:end;color:#778ba0;font-size:8px;font-weight:800}.student-fact strong{align-self:start;color:#183f68;font-size:12px;white-space:nowrap}.student-fact.fact-course>i{background:#ece8ff;color:#6b53d4}.student-fact.fact-license>i{background:#ddf7ec;color:#0b9270}.student-hero-quote{display:flex;align-items:center;gap:9px;margin-top:16px;color:#3f6282;font-size:10px;font-style:italic}.student-hero-quote b{color:#91c8ff;font-family:Georgia,serif;font-size:38px;line-height:.5}.student-hero-motto{position:absolute;left:34px;bottom:16px;display:flex;align-items:center;gap:10px;color:#4280bb;font-size:7px;font-weight:900;letter-spacing:.14em}.student-hero-motto span{color:#93c7f5}.student-hero-actions{display:grid;grid-template-columns:1fr;gap:12px}.schedule-cta{display:flex;min-width:0;align-items:center;gap:14px;padding:18px 16px;border:1px solid #dce9f6;border-radius:21px;background:#fff;color:#173f68;text-decoration:none;box-shadow:0 9px 24px #1a557f0e;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.schedule-cta:hover{transform:translateY(-2px);box-shadow:0 15px 31px #1a557f1b}.schedule-cta>span.hero-action-icon{display:grid;width:58px;height:58px;place-items:center;flex:0 0 auto;border-radius:18px;background:#e7efff;color:#5a57df}.hero-action-icon svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.hero-action-theory{border-color:#cfede3;background:linear-gradient(135deg,#fff,#f1fffa)}.hero-action-theory>span.hero-action-icon{background:#dff7ef;color:#078f75}.hero-action-theory .hero-action-icon svg{fill:currentColor;stroke:none}.hero-action-refresh{border-color:#eddcbd;background:linear-gradient(135deg,#fff,#fff9ef);color:#78501c}.hero-action-refresh>span.hero-action-icon{background:#fff0d4;color:#9b6115}.schedule-cta div{display:grid;min-width:0;gap:4px;flex:1}.schedule-cta strong{color:inherit;font-size:14px;line-height:1.2}.schedule-cta small{overflow:hidden;color:#71859a;font-size:9px;font-weight:700;line-height:1.4;text-overflow:ellipsis}.hero-action-arrow{display:grid;width:38px;height:38px;place-items:center;flex:0 0 auto;border-radius:50%;background:#edf5ff;color:#2078d2;font-size:20px}.hero-action-theory .hero-action-arrow{background:#e3f7ef;color:#078f75}.hero-action-refresh .hero-action-arrow{background:#fff0d7;color:#8e5a16}.student-refresh-access.is-locked{cursor:not-allowed;filter:saturate(.55);opacity:.72}.student-refresh-access.is-locked .hero-action-arrow{color:#8a969f}.student-refresh-access[aria-disabled="true"]{pointer-events:auto}
@media(max-width:1050px){.student-hero{grid-template-columns:1fr}.student-hero-actions{grid-template-columns:repeat(3,minmax(0,1fr))}.schedule-cta{padding:14px}.schedule-cta>span.hero-action-icon{width:46px;height:46px;border-radius:14px}.hero-action-icon svg{width:23px;height:23px}.hero-action-arrow{display:none}}
@media(max-width:760px){.student-profile-content{align-items:flex-start;gap:18px;padding:23px 21px 52px}.student-photo-wrap{width:116px;height:142px;border-width:5px;border-radius:22px}.student-photo-wrap img,.student-photo-wrap>span{border-radius:16px}.student-photo-wrap>i{right:-9px;bottom:-9px;width:38px;height:38px;border-width:4px}.student-heading h1{font-size:30px}.student-profile-facts{display:grid;grid-template-columns:1fr 1fr}.student-fact{min-width:0}.student-fact:nth-child(3){grid-column:1/-1}.student-hero-actions{grid-template-columns:1fr}.hero-action-arrow{display:grid}}
@media(max-width:520px){.student-hero{padding:9px;border-radius:20px}.student-profile-showcase{min-height:0;border-radius:17px}.student-profile-content{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:18px 15px 58px}.student-photo-wrap{width:92px;height:116px;border-radius:18px}.student-photo-wrap img,.student-photo-wrap>span{border-radius:13px}.student-heading p{font-size:7px;letter-spacing:.08em}.student-heading h1{margin-bottom:12px;font-size:23px}.student-profile-facts{grid-column:1/-1;grid-template-columns:1fr}.student-fact:nth-child(3){grid-column:auto}.student-hero-quote{grid-column:1/-1;margin-top:8px;font-size:8px}.student-hero-motto{left:15px;bottom:13px;gap:6px;font-size:6px}.schedule-cta{border-radius:16px}.schedule-cta strong{font-size:12px}.schedule-cta>span.hero-action-icon{width:44px;height:44px}.hero-action-arrow{width:32px;height:32px}}
'''
          css,n=re.subn(r'\.student-hero\{.*?(?=\.theory-account-section\{)',hero_css,css,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Không tìm thấy CSS hồ sơ cũ (found={n})')

          # Apply the previously approved attendance redesign too, if the old block is still present.
          if 'attendance-v2' not in html:
              attendance='''<section id="studentAttendance" class="portal-section student-attendance-section attendance-v2" aria-labelledby="studentAttendanceHeading"><div class="section-heading attendance-student-heading attendance-v2-heading"><div><p>CHUYÊN CẦN CỦA TÔI</p><h2 id="studentAttendanceHeading">Điểm danh &amp; Giờ thực học</h2><small>Theo dõi tình trạng tham gia và thời lượng học thực tế của bạn.</small></div><span id="studentAttendanceRate">0% chuyên cần</span></div><div class="student-attendance-metrics attendance-v2-metrics"><article><span>▣</span><div><small>Tổng buổi</small><strong id="studentAttendanceSessions">0</strong></div></article><article><span>✓</span><div><small>Có mặt</small><strong id="studentAttendancePresent">0</strong></div></article><article><span>◷</span><div><small>Giờ thực học</small><strong id="studentAttendanceHours">0 giờ</strong></div></article><article><span>◎</span><div><small>Vắng / Có phép</small><strong id="studentAttendanceAbsent">0 / 0</strong></div></article></div><div class="attendance-history-heading"><h3>Lịch sử điểm danh</h3><span id="studentAttendanceRecordCount">Hiển thị 0 bản ghi</span></div><div id="studentAttendanceList" class="student-attendance-list"></div><p id="studentAttendanceNotice" class="student-payment-history-notice hidden">Dữ liệu điểm danh đang được cập nhật.</p></section>'''
              html,m=re.subn(r'<section id="studentAttendance" class="portal-section student-attendance-section" aria-labelledby="studentAttendanceHeading">.*?</section>',attendance,html,count=1,flags=re.S)
              if m!=1: raise SystemExit(f'Không tìm thấy giao diện điểm danh cũ (found={m})')

          html=re.sub(r'href="/student\.css(?:\?[^\"]*)?"','href="/student.css?v=20260909-dashboard-v3"',html,count=1)
          html=re.sub(r'src="/student\.js(?:\?[^\"]*)?"','src="/student.js?v=20260909-dashboard-v3"',html,count=1)
          html_path.write_text(html,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')

          if 'studentAttendanceRecordCount' not in js:
              needle='  const summary=attendanceSummary(studentAttendance);\n'
              if needle in js:
                  js=js.replace(needle,needle+'  const countEl=$("studentAttendanceRecordCount");if(countEl)countEl.textContent=`Hiển thị ${studentAttendance.length} bản ghi`;\n',1)
          js_path.write_text(js,encoding='utf-8')
          PY

      - name: Restore helper workflow and commit
        shell: bash
        run: |
          cat > .github/workflows/bump-toolbar-css.yml <<'YML'
          name: Bump toolbar CSS version

          on:
            push:
              branches: [main]
              paths:
                - .github/toolbar-css-trigger.txt

          permissions:
            contents: write

          jobs:
            bump:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Update CSS query version
                  run: |
                    python - <<'PY'
                    from pathlib import Path
                    p=Path('index.html')
                    s=p.read_text(encoding='utf-8')
                    s=s.replace('/admin-toolbar-unified.css?v=1','/admin-toolbar-unified.css?v=2')
                    p.write_text(s,encoding='utf-8')
                    PY
                - name: Commit
                  run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add index.html
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "Làm mới đường dẫn CSS bộ icon"
                    git push
          YML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoc-vien.html student.css student.js .github/workflows/bump-toolbar-css.yml
          git diff --cached --check
          git commit -m "Xóa giao diện hồ sơ cũ và thay bằng giao diện mới"
          git push origin main
