name: Apply student dashboard redesign

on:
  push:
    branches: [main]
    paths:
      - .github/toolbar-css-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply redesign
        run: python3 .github/patch_student_hero.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoc-vien.html student.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Xóa giao diện hồ sơ cũ và thay bằng giao diện mới"
          git push origin main
