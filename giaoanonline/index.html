function gaTranslateText(s){
  if(window.gaUiLang!=='en')return s;

  for(const [re,r] of GA_EN_PATTERNS){if(re.test(core)){let pr=gaReplaceAllKnown(core.replace(re,r));pr=pr.replace(/(\d+(?:[.,]\d+)?)\s*tiết/gi,'$1 periods').replace(/(\d+(?:[.,]\d+)?)\s*giờ/gi,'$1 hours').replace(/(\d+(?:[.,]\d+)?)\s*phút/gi,'$1 minutes');return lead+pr+trail}}
  let out=gaReplaceAllKnown(core);
  // Common dynamic fragments and punctuation.
  out=out.replace(/\b(\d+(?:[.,]\d+)?)\s*phút\b/gi,'$1 minutes').replace(/\b(\d+(?:[.,]\d+)?)\s*tiết\b/gi,'$1 periods').replace(/\b(\d+(?:[.,]\d+)?)\s*giờ\b/gi,'$1 hours');
  out=out.replace(/ngày\s*(\d{1,2})\s*tháng\s*(\d{1,2})\s*năm\s*(\d{4})/gi,'$1/$2/$3');
  out=out.replace(/\btháng\b/gi,'month').replace(/\bnăm\b/gi,'year');
  // Strict English display: never leave Vietnamese diacritics visible in English mode.
  if(GA_VI_DIACRITICS.test(out)){
    const lines=out.split(/\n/).map(line=>{
      let t=gaReplaceAllKnown(line);
      if(GA_VI_DIACRITICS.test(t)){

        let code=t.match(/\b(MH\s*\d+|GA\s*\d+|\d+(?:[.,]\d+)?(?:\s*(?:minutes|periods|hours))?)\b/gi)||[];
        return code.length?`English content ${code.join(' · ')}`:'English content';
      }
      return t;
    });
    out=lines.join('\n');
  }
  return lead+out+trail;
}

function createSubjectOptions(selected=''){let names=[];for(const p of moduleProgramStore?.programs||[])if(String(p.name||'').trim())names.push(p.name.trim());for(const l of state.lessons||[])if(String(l.subject||'').trim())names.push(l.subject.trim());let uniq=[...new Map(names.map(n=>[normText(n),n])).values()].sort((a,b)=>a.localeCompare(b,'vi'));if(!uniq.length)return `<input name="subject" type="text" value="${esc(selected)}" required>`;return `<select name="subject" required>${uniq.map(n=>`<option value="${esc(n)}" ${normText(n)===normText(selected)?'selected':''}>${esc(n)}${programForSubject(n)?.code?` (${esc(programForSubject(n).code)})`:''}</option>`).join('')}</select>`}

function editor(id){let l=byId(id);if(!l)return home();if(l.stabilizationMinutes==null)l.stabilizationMinutes=1;if(l.executeDateEnd==null)l.executeDateEnd='';let sum=total(l),ok=sum===Number(l.duration),dateFields=l.type==='theory'?editDateField('executeDate','Thực hiện ngày',l.executeDate,6):editDateField('executeDate','Thực hiện từ ngày',l.executeDate,6)+editDateField('executeDateEnd','Đến ngày',l.executeDateEnd,6);app.innerHTML=shell(`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px"><div><button class="btn sm" data-route="library">← Kho giáo án</button><h1 class="h1" style="margin-top:10px">Giáo án số ${esc(l.lessonNo||'—')} – ${esc(l.title||'Chưa đặt tên')}</h1><span class="badge ${TYPE[l.type].cls}">${TYPE[l.type].label}</span></div><div class="actions"><button class="btn" id="suggest">✨ Gợi ý nhanh</button><button class="btn" data-preview="${l.id}">👁 Xem trước</button><button class="btn primary" id="saveBtn">Lưu</button><button class="btn" id="wordBtn">Xuất Word</button><button class="btn danger" id="pdfBtn">Xuất PDF</button></div></div>${moduleObjectiveBanner(l)}<div class="editor"><div class="panel sticky"><div class="panel-head"><h2>Thông tin chung</h2></div><div class="panel-body"><div class="form-grid">${editField('lessonNo','Giáo án số',l.lessonNo,6)}${editField('durationPeriods','Thời gian thực hiện (tiết; 1 tiết=45 phút )',Math.round(((Number(l.duration)||0)/45)*100)/100,6,'number')}${editField('stabilizationMinutes','Ổn định lớp (phút)',l.stabilizationMinutes,6,'number')}${editField('subject',l.type==='integrated'?'Môn học / Mô-đun':'Môn học',l.subject,12)}${editField('className','Lớp',l.className,6)}${editField('schoolYear','Năm học',l.schoolYear,6)}${dateFields}${editField('teacher','Họ và tên giáo viên',l.teacher,12)}${editField('chapter',l.type==='theory'?'Tên chương/bài':l.type==='practice'?'Bài học trước':'Tên bài học trước',l.chapter,12)}${editField('title','Tên bài',l.tit function bindEditor(l){document.querySelectorAll('[data-date-field]').forEach(x=>x.onblur=()=>{let raw=String(x.value||'').trim();if(!raw){l[x.dataset.dateField]='';save();return}let iso=isoFromVNStrict(raw);if(!iso){alert('Ngày chưa đúng định dạng dd/mm/yyyy.');x.value=fmt(l[x.dataset.dateField]||'');return}l[x.dataset.dateField]=iso;x.value=fmt(iso);l.updatedAt=new Date().toISOString();save()});document.querySelectorAll('[data-field]').forEach(x=>x.oninput=()=>{if(x.dataset.field==='durationPeriods')l.duration=(Number(x.value)||0)*45;else l[x.dataset.field]=['duration','stabilizationMinutes'].includes(x.dataset.field)?Number(x.value):x.value;l.updatedAt=new Date().toISOString();if(x.dataset.field==='teacher')state.profile.teacher=x.value;if(x.dataset.field==='schoolYear')state.profile.schoolYear=x.value;save()});document.querySelectorAll('[data-item]').forEach(x=>x.oninput=()=>{let a=l.activities.find(a=>a.id===x.dataset.actid);if(!a)return;let it=ensureActivityItems(a).find(it=>it.id===x.dataset.itemid);if(!it)return;it[x.dataset.item]=x.dataset.item==='minutes'?Number(x.value):x.value;if(x.dataset.item==='topic')it.topicStart=true;a.minutes=activityMinutes(a);l.updatedAt=new Date().toISOString();if(x.dataset.item==='minutes'){let groups=theoryTopicGroups(a);for(const g of groups){let first=g.items[0];if(g.startId&&first){let el=document.querySelector(`[data-topic-total="${a.id}:${first.id}"]`);if(el)el.textContent=g.items.reduce((s,z)=>s+(Number(z.minutes)||0),0)+' phút'}}}save()});document.querySelectorAll('[data-add-item]').forEach(b=>b.onclick=()=>{let a=l.activities.find(a=>a.id===b.dataset.addItem);if(!a)return;ensureActivityItems(a).push({id:uid(),topicStart:false,topic:'',content:'',teacher:'',student:'',minutes:0});a.minutes=activityMinutes(a);save();editor(l.id)});document.querySelectorAll('[data-add-topic]').forEach(b=>b.onclick=()=>{let a=l.activities.find(a=>a.id===b.dataset.addTopic);if(!a)return;ensureActivityItems(a).push({id:uid(),topicStart:true function distribute(l){ensureLessonItems(l);let d=Number(l.duration)||0,stab=Number(l.stabilizationMinutes)||0;if(!d)return;let main=Math.floor(l.activities.length/2),reserved=stab+l.activities.reduce((s,a,i)=>s+(i===main?0:activityMinutes(a)),0),target=l.activities[main];let items=ensureActivityItems(target),other=items.slice(1).reduce((s,it)=>s+(Number(it.minutes)||0),0);items[0].minutes=Math.max(0,d-reserved-other);target.minutes=activityMinutes(target)}
function suggest(l){ensureLessonItems(l);let title=l.title||'bài học';if(!l.objectives)l.objectives=`Sau khi học xong bài “${title}”, người học có khả năng:\n- Trình bày được nội dung và yêu cầu kỹ thuật liên quan.\n- Thực hiện đúng trình tự, đảm bảo yêu cầu kỹ thuật và an toàn (nếu có thao tác).\n- Có ý thức tổ chức, kỷ luật, vệ sinh và chủ động trong học tập.`;if(!l.equipment)l.equipment='Giáo án, tài liệu học tập, máy tính/máy chiếu và dụng cụ, thiết bị chuyên môn phù hợp với nội dung bài.';if(l.type!=='theory'&&!l.organization)l.organization='Tổ chức theo nhóm kết hợp hướng dẫn chung và hướng dẫn tại vị trí luyện tập; đảm bảo an toàn, trật tự và vệ sinh.';let map={theory:[['Giới thiệu tổng quan và mục tiêu bài học.','Giới thiệu mục tiêu, nêu tình huống thực tế liên quan.','Lắng nghe, trao đổi và xác định nhiệm vụ học tập.'],[`Nội dung trọng tâm của “${title}”.`,`Trình bày nội dung “${title}”, phân tích các điểm cần lưu ý.`,`Theo dõi, ghi chép, trả lời câu hỏi và trao đổi.`],['Khái quát và củng cố nội dung chính.','Hệ thống hóa trọng tâm; đặt câu hỏi củng cố.','Trả lời câu hỏi, tóm tắt kiến thức chính.'],['Nhiệm vụ tự học và chuẩn bị bài sau.','Giao nhiệm vụ tự học, hướng dẫn tài liệu.','Ghi nhận nhiệm vụ và chuẩn bị nội dung tiếp theo.']],practice:[['Giới thiệu yêu cầu và sản phẩm thực hành.','Nêu tình huống thực tế, yêu cầu sản phẩm và tiêu chí.','Lắng nghe, xác định nhiệm vụ.'],[`Chuẩn bị và quy trình “${title}”.`,`Giới thiệu dụng cụ; hướng dẫn quy trình “${title}”; làm mẫu và nhắc an toàn.`,`Quan sát, ghi chép, đặt câu hỏi và chuẩn bị luyện tập.`],['Thực hành theo quy trình.','Quan sát luyện tập; uốn nắn thao tác; hỗ trợ khi cần.','Thực hiện theo quy trình, tự kiểm tra và báo cáo khó khăn.'],['Nhận xét kết quả và sai sót cần khắc phục.','Nhận xét kết quả; chỉ ra sai sót và cách khắc phục.','Báo cáo kết quả, rút kinh nghiệm, thu dọn dụng cụ.'],['Nội dung tự rèn luyện.','Giao nhiệm vụ luyện tập bổ sung và chuẩn bị bài sau.','Ghi nhận nhiệm vụ và tự luyện.']],in function hourDistTotalRowHtml(){let t=hourDistTotals();return `<td></td><td class="name-cell"><b>Cộng</b></td><td><b>${fmtHours(t.total)}</b></td><td><b>${fmtHours(t.theory)}</b></td><td><b>${fmtHours(t.practice)}</b></td><td><b>${fmtHours(t.ktLT)}</b></td><td><b>${fmtHours(t.ktTH)}</b></td><td><b>${fmtHours(t.thiLT)}</b></td><td><b>${fmtHours(t.thiTH)}</b></td>`}
function hourDistCheckHtml(){let rows=moduleProgram.hourDistribution||[],bad=rows.filter(r=>Math.abs((Number(r.total)||0)-hourDistComponentSum(r))>.0001),t=hourDistTotals(),component=t.theory+t.practice+t.ktLT+t.ktTH+t.thiLT+t.thiTH,assessment=t.ktLT+t.ktTH+t.thiLT+t.thiTH,lines=[];if(bad.length)lines.push(`<div class="check-line bad"><b>Sai tổng ở ${bad.length} dòng:</b> ${bad.map(r=>esc(r.title||('Dòng '+r.order))).join('; ')}. “Tổng số” phải bằng tổng các cột thành phần.</div>`);else lines.push('<div class="check-line ok"><b>Từng dòng:</b> Tất cả đều khớp Tổng số.</div>');let diffTotal=Number(moduleProgram.totalHours||0)-t.total;lines.push(`<div class="check-line ${Math.abs(diffTotal)<.0001?'ok':'bad'}"><b>Tổng toàn môn:</b> ${fmtHours(t.total)} / ${fmtHours(moduleProgram.totalHours||0)} giờ — ${Math.abs(diffTotal)<.0001?'ĐỦ':diffTotal>0?'THIẾU '+fmtHours(diffTotal)+' giờ':'VƯỢT '+fmtHours(-diffTotal)+' giờ'}.</div>`);let theoryDiff=Number(moduleProgram.theoryHours||0)-t.theory,practiceDiff=Number(moduleProgram.practiceHours||0)-t.practice,assessDiff=Number(moduleProgram.assessmentHours||0)-assessment;lines.push(`<div class="check-line ${Math.abs(theoryDiff)<.0001&&Math.abs(practiceDiff)<.0001&&Math.abs(assessDiff)<.0001?'ok':'bad'}"><b>Đối chiếu cơ cấu:</b> Lý thuyết ${fmtHours(t.theory)}/${fmtHours(moduleProgram.theoryHours||0)}h; Thực hành ${fmtHours(t.practice)}/${fmtHours(moduleProgram.practiceHours||0)}h; KT + Thi ${fmtHours(assessment)}/${fmtHours(moduleProgram.assessmentHours||0)}h.</div>`);let compDiff=t.total-component;if(Math.abs(compDiff)>.0001)lines.push(`<div class="check-line bad"><b>Cảnh báo:</b> Tổng cột “Tổng số” lệch ${fmtHours(Math.abs(compDiff))} giờ so với tổng các cột thành phần.</div>`);return lines.join('')}

{['total','theory','practice','ktLT','ktTH','thiLT','thiTH'].map(k=>`<td><input data-hfield="${k}" data-hid="${r.id}" type="number" min="0" step="0.25" value="${Number(r[k])||0}"></td>`).join('')}</tr>`}).join('')}<tr id="hourDistTotals" class="sum-row">${hourDistTotalRowHtml()}</tr></tbody></table></div><div id="hourDistCheck" class="hour-dist-check">${hourDistCheckHtml()}</div></div>`}
